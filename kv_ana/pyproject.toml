[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvreuse-b5"
version = "2.0.1"
description = "CPU-first offline experiments for non-prefix KV/state reuse"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
yaml = ["PyYAML>=6"]
test = ["pytest>=8"]

[project.scripts]
kvreuse-smoke = "kvreuse_b5.cli.smoke:main"
kvreuse-run = "kvreuse_b5.cli.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
