# Independent mini-SWE model overlay. No model weights or runtime hooks loaded.
model:
  model_name: hosted_vllm/deepseek-v41
  model_class: agentmon.adapters.agent_frameworks.mini_swe.profiled_model.ProfiledLitellmModel
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: http://127.0.0.1:8800/v1
    api_key: not-needed
    drop_params: true
    temperature: 0
    max_tokens: 4096
    timeout: 600
    extra_body:
      chat_template_kwargs:
        thinking: false
    # Explicit presence opts into the existing generic correlation header path.
    extra_headers: {}
